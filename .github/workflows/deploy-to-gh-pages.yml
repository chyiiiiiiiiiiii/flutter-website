name: Deploy to GitHub Pages

on:
  push:
    branches:
      - zh-tw
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Fetch Dart dependencies
        run: dart pub get

      - name: Build site (docs)
        # --release sets PRODUCTION=true so robots.txt allows search-engine
        # crawling (staging builds emit `Disallow: /`) and assets are optimized.
        run: dart run dash_site --site=docs build --release

      - name: Copy CNAME file
        run: cp CNAME _site/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
