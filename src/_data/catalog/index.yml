- name: 基礎
  description: >-
    建立第一個 Flutter 應用程式前必須了解的元件。
  priority: high
  id: basics
- name: Material 元件
  description: >-
    實現 Material 3 設計規範的視覺、行為與動態豐富元件。
  subcategories:
    - name: '操作'
      color: '#D9E7CB'
    - name: '通訊'
      color: '#F9DBDA'
    - name: '容器'
      color: '#F9DBDA'
    - name: '導覽'
      color: '#E5E4C2'
    - name: '選擇'
      color: '#D9E7CB'
    - name: '文字輸入'
      color: '#E5E4C2'
  id: material
- name: Material 2 元件
  description: 實現 Material 2 設計指南的元件。
  subcategories:
    - name: '應用結構與導覽'
    - name: '按鈕'
    - name: '輸入與選擇'
    - name: '對話框、警示與面板'
    - name: '資訊顯示'
    - name: '版面配置'
  id: material2
- name: Cupertino
  description: >-
    美觀且高擬真的元件，符合 Apple iOS 與 macOS 的人機介面指引。
  id: cupertino
- name: 版面配置
  description: >-
    以欄、列、格狀等多種方式排列其他元件。
  subcategories:
    - name: '單一子元件版面配置'
      description: >-
        接收單一子元件並調整其版面配置的元件。
    - name: '多子元件版面配置'
      description: >-
        這些元件接收多個子元件並以不同方式排列。
    - name: 'Sliver 元件'
      description: >-
        這些元件用於 CustomScrollView 的部分，並為該部分套用版面配置。
  id: layout
- name: 文字
  description: 顯示與設計文字。
  id: text
- name: '資源、圖片與圖示'
  description: 管理資源、顯示圖片與圖示。
  id: assets
- name: 輸入
  description: >-
    除了 Material 元件與 Cupertino 的輸入元件外，還可接收使用者輸入。
  id: input
- name: 動畫與動態
  description: 為應用程式加入動畫效果。
  id: animation
- name: 互動模式
  description: 回應觸控事件並導引使用者至不同畫面。
  subcategories:
    - name: '觸控互動'
    - name: '路由'
  id: interaction
- name: 樣式
  description: >-
    管理應用程式主題、響應螢幕尺寸或加入間距。
  id: styling
- name: 繪圖與特效
  description: >-
    這些元件為子元件套用視覺特效，但不改變其版面、大小或位置。
  id: painting
- name: 非同步
  description: 支援 Flutter 應用程式非同步模式的元件。
  id: async
- name: 捲動
  description: 讓多個元件作為父元件的子元件一起捲動。
  subcategories:
    - name: 'Sliver 元件'
      description: >-
        這些元件用於 CustomScrollView 的部分，並為該部分套用版面配置。
  id: scrolling
- name: 無障礙
  description: 讓您的應用程式具備無障礙功能。
  id: accessibility
